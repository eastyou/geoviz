name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test timezone conversion
        run: |
          python -m geoviz convert --at "2026-11-21 12:00" --from 北京 --to 纽约,伦敦,东京
          python -m geoviz html --at "2026-11-21 12:00" --from 北京 -o smoke.html
          python -c "print(open('smoke.html', encoding='utf-8').read().count('clock'))"
