[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoviz"
version = "0.1.0"
description = "世界时区换算与 24 小时带可视化，适合地理课与跨国协作"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["timezone", "geography", "education", "visualization", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
geoviz = "geoviz.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/geoviz"
Source = "https://github.com/eastyou/geoviz"

[tool.setuptools]
packages = ["geoviz"]
